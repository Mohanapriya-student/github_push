    <title>Document</title>

<body>
    <script>
        let age=20;

        if(age<=20){
          document.write("Adults") 
          if(age>20){
          document.write("youth")
          }
        else{
            document.write("  ,not youth");
        }

        }


        let color=prompt("Enter the color:");
        switch(color){
            case "red":
                document.write("stop");
                break;

            case  "green":
                 document.write("go");
                 break;

            default:
                 document.write("unknown color");
        }
          
    </script>
