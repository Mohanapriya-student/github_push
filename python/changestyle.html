<body>
   <p id="demo">Welcome</p> 
   <button onclick="changeStyle()">change</button>
   <script>
    function changeStyle()
    {
        let x=document.getElementById("demo")
        x.style.color="red";
        x.style.backgroundColor="yellow";
        x.style.fontsize="45px";
    }
   </script>
</body>
