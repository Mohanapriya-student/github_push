<html lang="en">
<head>
    
    <title>Document</title>
</head>
<body>
    <button ondblclick="show()">click me</button>
    <p id="msg"></p>

        function show()
        {
            document.getElementById("msg").innerHTML="clicked";
        }
    </script>
</body>
