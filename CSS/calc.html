<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Document</title>
    

<body>
    <h1>Welcome...</h1>
    <form>
        <label>subject 1</label>
        <input type="text" id="sub1">
        <br>

        <label>subject 2</label>
        <input type="text" id="sub2">
        <br>

        <Label>subject 3</Label>
        <input type="text" id="sub3">
        <br>

        <label>subject 4</label>
        <input type="text" id="sub4">
        <br>

        <label>subject 5</label>
        <input type="text" id="sub5">
        <br>

        <button>cancel</button>
        <button onclick="Calculate()">Calculate</button>

        <br>
        <h3 id="result"></h3>

        
      </form>


      <script>
       function Calculate()
       {
        let sub1=Number(document.getElementById("sub1").value);
        let sub2=Number(document.getElementById("sub2").value)
        let sub3=Number(document.getElementById("sub3").value)
        let sub4=Number(document.getElementById("sub4").value)
        let sub5=Number(document.getElementById("sub5").value)

        let total=sub1+sub2+sub3+sub4+sub5;
        let percentage=total/5;
      
        document.getElementById("result").innerHTML="totalmarks:" + total +"<br>percentage:"+ percentage +"%";
       }
      </script>
    
</body>
</head>
</html>
